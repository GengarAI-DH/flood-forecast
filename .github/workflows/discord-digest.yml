name: Daily Discord digest
on:
  schedule:
    - cron: "17 15 * * *"   # about 7:17 AM Pacific (8:17 AM during daylight time)
  workflow_dispatch: {}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/discord_digest.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SITE_URL: ${{ vars.SITE_URL }}
